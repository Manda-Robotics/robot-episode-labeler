[project]
name = "robot-episode-labeler"
version = "0.1.0"
description = "Robot manipulation video -> timestamped subtask annotations, as one inference endpoint."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=1.0.0",
    "pillow>=10.4",
    "pydantic>=2.9",
    "numpy>=2.0",
    "pyarrow>=17.0",
    "imageio-ffmpeg>=0.6.0",
    "mcap>=1.4.0",
]

[project.scripts]
rel = "rel.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "certifi>=2024.0", "mcap>=1.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rel"]
